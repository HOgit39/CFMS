name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    name: Run PR Agent
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@main
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # モデル設定
          CONFIG.MODEL: "gemini/gemini-3.8-flash"
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: 64000
          
          # 基本の言語設定
          CONFIG.LANGUAGE: "Japanese" 
          
          # --- 実行するツールの有効化 ---
          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"  # インラインコメント（コード提案）に必須
          github_action_config.handle_push_trigger: "true"
          
          # --- インラインコメントの制御 ---
          PR_REVIEWER.INLINE_CODE_COMMENTS: "true"
          PR_CODE_SUGGESTIONS.NUM_CODE_SUGGESTIONS: 5
          
          # --- 各ツールに対する強力な日本語化の強制 ---
          PR_DESCRIPTION.EXTRA_INSTRUCTIONS: "Please respond entirely in Japanese. 日本語で出力してください。"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: "Please respond entirely in Japanese. 日本語で出力してください。"
          PR_CODE_SUGGESTIONS.EXTRA_INSTRUCTIONS: "Please respond entirely in Japanese. 日本語で出力してください。"